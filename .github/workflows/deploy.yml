name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type:check

      - name: Tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # When GitHub's Pages queue is slow this step aborts at 10 minutes and that
      # permanently poisons the commit SHA — the Pages deployment id IS the SHA, and a
      # cancelled one can never be retried, so recovery means landing a new commit.
      # Raising the `timeout` input does NOT help: the action caps it at MAX_TIMEOUT
      # (600000 ms) with Math.min, so anything larger is silently ignored. Tried it.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
