version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # typescript-eslint peers on typescript <6.1.0, so a major TypeScript bump can only
      # ever fail npm ci here. Drop this once typescript-eslint supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      security-npm:
        applies-to: security-updates
        patterns:
          - '*'
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      security-actions:
        applies-to: security-updates
        patterns:
          - '*'
      actions:
        update-types:
          - minor
          - patch
